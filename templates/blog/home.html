<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
</head>
<body>
    <h1>Welcome to my blog</h1>
    <h2>Latest Posts</h2>
    {% for post in posts %}
        <div>
            <h3>{{post.title}}</h3>
            <p>{{post.content}}</p>
            <p> Category: {{post.category}}</p>
            <p>At {{post.created_at}} by {{post.author}}</p>
        </div>
        {% endfor %}

</body>
</html>
