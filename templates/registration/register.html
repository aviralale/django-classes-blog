{% extends 'base.html' %}

{% block title%} Signup {% endblock %}

{% block content %}
<h1>Create an account</h1>

<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div>
            {{ field.label_tag}} {{ field }}
            {% if field.help_text %}
                <small class="form-text text-muted">{{ field.help_text }}</small>
            {% endif %}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button type="submit">Sign up</button>

</form>

{% endblock %}
